# cbindgen settings for include/ww2_core.h. Regenerate the header with
#   WW2_WRITE_HEADER=1 cargo test -p ww2-ffi --test header
language = "C"
header = "/* The C interface to the ww2-rts rules core (docs/contracts/rust-unreal-abi.md). */"
autogen_warning = "/* Generated by cbindgen from rust/crates/ffi. Do not edit: run `WW2_WRITE_HEADER=1 cargo test -p ww2-ffi --test header`. */"
include_guard = "WW2_CORE_H"
cpp_compat = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
style = "both"
documentation_style = "c99"
