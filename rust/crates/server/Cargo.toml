[package]
name = "ww2-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "HTTP and WebSocket lobby host for Three Crossroads."

[dependencies]
ww2-core = { path = "../core" }
axum = { version = "=0.8.9", features = ["ws"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
