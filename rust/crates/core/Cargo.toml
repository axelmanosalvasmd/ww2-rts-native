[package]
name = "ww2-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The ww2-rts rules core: no engine, networking or file-system code."

[lib]
name = "ww2_core"

[dependencies]
# Match the harness parser and preserve every finite IEEE 754 number.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
