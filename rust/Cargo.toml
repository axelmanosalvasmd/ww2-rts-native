[workspace]
resolver = "3"
members = ["crates/core", "crates/ffi", "crates/simtest", "crates/server"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[profile.ci-test]
inherits = "test"
opt-level = 2
debug = 0
debug-assertions = true
overflow-checks = true
incremental = false
