[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Three Crossroads
Description=Unreal client for the Three Crossroads WW2 RTS

[/Script/UnrealEd.ProjectPackagingSettings]
; Linux packaging (unreal/Tools/tc-package-linux.sh). The project has no authored maps: the engine's Entry map, the
; engine shapes the unit renderer and the effects load from C++, the imported reference sounds, and data files.
BuildConfiguration=PPBC_Development
UsePakFile=True
bUseIoStore=True
IncludeCrashReporter=False
+MapsToCook=(FilePath="/Engine/Maps/Entry")
; ATCUnitRenderer's ConstructorHelpers (Cube, Cylinder, Cone, BasicShapeMaterial): only C++ refers to them, and they are
; not among the engine's startup packages, so the cook is told to take them. The ground and the map's pieces no longer
; use the engine's VertexColorMaterial (slice 11: /Game/Models/Materials/Look and /Game/World).
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
; the game's sounds (Content/Audio: 35 effects and 144 voice lines imported by unreal/Tools/import-reference-audio.sh) are
; loaded by path only (UTCAudio's soft paths, at a match start), so nothing in a map refers to them: the cook is told
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
; Content/Data/units.json and locale-es.json (the Spanish dictionary, Client/TCLocale.h), loaded with FFileHelper from the
; project's Content folder: staged into the pak as files
+DirectoriesToAlwaysStageAsUFS=(Path="Data")
; the reference's unit models (Content/Models, imported by unreal/Tools/models): ATCUnitRenderer finds them through
; Content/Models/ModelCatalog.json and Content/Models/Infantry/Source/kits.json (soft paths, loaded with FFileHelper), so
; nothing in a map refers to them: the cook is told to take the folder, and the two JSON files are staged with it
+DirectoriesToAlwaysCook=(Path="/Game/Models")
+DirectoriesToAlwaysStageAsUFS=(Path="Models")
; slice 11. The map's pieces, props and foliage (FTCWorldObjectsView, World/TCWorldObjects.h) draw the /Game/Models meshes
; with the world materials (Content/World, unreal/Tools/world/make-world-materials.py), loaded by soft path only
+DirectoriesToAlwaysCook=(Path="/Game/World")
; the atmosphere's materials (World/TCAtmosphere.h), loaded by path at a match start
+DirectoriesToAlwaysCook=(Path="/Game/Atmosphere")
; slice 13. The relief's material (World/TCTerrain.h, unreal/Tools/relief/make-relief-material.py), the painted ground's
; function, materials and textures (World/TCGroundPaint.h, unreal/Tools/terrain/import-ground.py) and the water's and
; apron's materials (World/TCWater.h, World/TCApron.h, unreal/Tools/water/make-water-materials.py): loaded by path only
+DirectoriesToAlwaysCook=(Path="/Game/Relief")
+DirectoriesToAlwaysCook=(Path="/Game/Terrain")
+DirectoriesToAlwaysCook=(Path="/Game/Water")
; the effects' sprite atlas, crater and rubble textures and their materials (Content/Effects, unreal/Tools/effects), found
; through ConstructorHelpers on ATCEffects' default object, which no cooked map refers to
+DirectoriesToAlwaysCook=(Path="/Game/Effects")
; round 14. The paper war map's symbol atlas and font face (Client/TCWarMap.h, unreal/Tools/warmap), loaded by path,
; and Content/WarMap/WarMapData.json (the atlas layout and the shared/sim.js numbers), read with FFileHelper
+DirectoriesToAlwaysCook=(Path="/Game/WarMap")
+DirectoriesToAlwaysStageAsUFS=(Path="WarMap")
; round 17. client/index.html's typeface, Barlow Semi Condensed (Content/Fonts/BarlowSemiCondensed, fetched by
; unreal/Tools/fonts/fetch-barlow.sh): Client/TCStats.h FTCType reads the .ttf files with FFileHelper and draws them as a
; runtime font, so they are staged as files
+DirectoriesToAlwaysStageAsUFS=(Path="Fonts")
; the light (Client/TCLighting.h): its post process, ground and collection assets are under /Game/Models/Materials/Look
; (already cooked with /Game/Models above); the soldiers' far figures, Content/Models/Motion/FarFigures.bin, are read
; with FFileHelper and staged with the Models folder above
; the Android file server's per-project key in DefaultEngine.ini is not used on Linux: keep it out of the staged config
+IniKeyDenylist=SecurityToken

; reference ground marker layers and role badge atlas, loaded by soft path
+DirectoriesToAlwaysCook=(Path="/Game/Markers")
