; slice 11, the reference's light and color (Client/TCLighting.h, Config/TCPostProcess.md). ATCLighting's unbound post
; process volume locks these at run time; the defaults agree so editor views and captures start from the same place.
; No lightmaps in this client (everything is spawned movable from C++), so the GBuffer keeps material AO, which lets the
; model masters keep the engine sky light off their pixels (they add the reference's indirect light themselves).
